[build-system]
requires = ["hatchling>=1.26"]
build-backend = "hatchling.build"

[project]
name = "companybench"
version = "0.1.0"
description = "An open benchmark for company list building"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
dependencies = ["httpx>=0.28,<1", "pydantic>=2.10,<3", "typer>=0.15,<1", "filelock>=3.16,<4", "beautifulsoup4>=4.12,<5", "pypdf>=6,<7"]

[project.optional-dependencies]
excel = ["openpyxl>=3.1,<4"]
dev = ["pytest>=8,<10", "pytest-asyncio>=0.25,<2", "ruff>=0.11", "mypy>=1.15", "types-beautifulsoup4", "openpyxl>=3.1,<4"]

[project.scripts]
companybench = "companybench.cli:app"

[project.urls]
Repository = "https://github.com/Mesh-Interactive/CompanyBench"
Issues = "https://github.com/Mesh-Interactive/CompanyBench/issues"

[tool.hatch.build.targets.wheel]
packages = ["src/companybench"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["E501"]

[tool.mypy]
python_version = "3.11"
check_untyped_defs = true
ignore_missing_imports = true
