# All 250 queries, all 14 named systems. Configure every listed API key first.
[run]
providers = ["avina", "exa-websets", "exa-agent-high", "exa-agent-auto", "parallel-core", "parallel-pro", "openai-sol-medium", "openai-astra-max", "claude-sonnet-medium", "claude-opus-max", "gemini-flash-high", "gemini-pro-high", "grok-low", "grok-xhigh"]
judges = ["llm"]
target_count = 50
trials = 1
concurrency = 4
provider_concurrency = 2
poll_interval = 5
timeout = 7200
seed = 42
