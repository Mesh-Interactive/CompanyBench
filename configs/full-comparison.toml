[providers.avina]
# Use an isolated benchmark workspace with no personas or integrations.
# base_url = "https://api.avina.io/v1"
# account_credit_price = 0.25  # Your documented account rate, not a billed charge.

[providers.exa-websets]
public_monthly_usd = 449
public_included_credits = 100000

[judges.llm]
model = "gpt-6-astra"

[research]
model = "gpt-6-astra"
