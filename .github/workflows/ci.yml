name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  offline-checks:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.11', '3.12', '3.13']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Install development tools
        run: python -m pip install -e '.[dev]' build
      - name: Run offline tests serially
        run: python -m pytest -q
      - name: Check lint and formatting
        run: |
          python -m ruff check .
          python -m ruff format --check .
      - name: Check types
        run: python -m mypy src/companybench
      - name: Check whitespace
        run: git diff --check
      - name: Build distributions
        run: python -m build
      - name: Verify installed wheel outside the checkout
        working-directory: ${{ runner.temp }}
        run: |
          python -m venv companybench-wheel
          companybench-wheel/bin/python -m pip install "$GITHUB_WORKSPACE"/dist/*.whl
          companybench-wheel/bin/python -c 'from companybench.datasets import load_dataset; assert len(load_dataset()) == 250; assert len(load_dataset("development")) == 12'
          companybench-wheel/bin/companybench validate
          companybench-wheel/bin/companybench demo --output "$RUNNER_TEMP/companybench-wheel-demo"
